name: golangci-lint
on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    name: lint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod   # NOT a literal: a hardcoded version silently keeps CI on an old toolchain
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2 (config is version "2"); keep in sync with local dev.
          # ⚠ Must be built with a Go >= go.mod's `go` directive, or it refuses to
          # load the config at all ("language version ... lower than the targeted
          # Go version"). v2.13.2 is built with go1.27. Bump this with the toolchain.
          version: v2.13.2

